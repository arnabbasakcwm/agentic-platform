[project]
name = "agentic-platform"
version = "0.1.0"
description = "Natural-language multi-agent builder: brief in, compiled LangGraph endpoints out."
requires-python = ">=3.11,<3.12"
dependencies = [
    "langchain>=0.3",
    "langgraph>=0.2",
    "langchain-openai>=0.2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "langchain-google-genai>=4.4.0",
    "langchain-tavily>=0.2",
    "requests>=2.32",
    "yfinance>=1.7",
    "pymongo>=4.10",
    "pyjwt>=2.9",
    "argon2-cffi>=23.1",
    "email-validator>=2.2",
    "boto3>=1.40",
    "pypdf>=5",
    "python-docx>=1.1",
    "python-multipart>=0.0.18",
    "numpy>=1.26",
    "langchain-groq",
    "langchain-aws>=1.0",
    "sqlglot>=30.21.0",
    "mcp>=2.3.0",
    "cryptography>=50.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_platform"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "e2e: makes real LLM API calls, excluded from the default test run",
]
addopts = "-m 'not e2e'"
