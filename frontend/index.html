<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agentic Platform Console</title>
    <script>
      // Apply a saved light/dark choice before the first paint (see src/lib/theme.js).
      try {
        const theme = localStorage.getItem("agentic-platform.theme");
        if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
      } catch {
        // Storage unavailable: follow the system theme.
      }
    </script>
    <!-- Inline icon: no /favicon.ico request, so no 404 in the console. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%237c3aed'/%3E%3Cg fill='none' stroke='white' stroke-width='2.2' stroke-linecap='round'%3E%3Ccircle cx='16' cy='9' r='2.6'/%3E%3Ccircle cx='9' cy='22' r='2.6'/%3E%3Ccircle cx='23' cy='22' r='2.6'/%3E%3Cpath d='M14.6 11.3 10.4 19.7M17.4 11.3l4.2 8.4M11.6 22h8.8'/%3E%3C/g%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
